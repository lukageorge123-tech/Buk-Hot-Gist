<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Hot Gist BUK</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f9fd;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            background: white;
            padding: 32px;
            border-radius: 15px;
            border-top: 5px solid #38bdf8;
            box-shadow: 0 6px 20px rgba(3, 105, 161, 0.12);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;

            border-radius: 50%;

            background: #0369a1;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-weight: bold;

            border: 4px solid #e0f2fe;
        }

        h2 {
            text-align: center;
            color: #075985;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 16px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #0ea5e9;

            box-shadow:
                0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        button {
            width: 100%;

            padding: 12px;
            margin-top: 5px;

            background: #0369a1;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #075985;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;

            font-size: 14px;
            font-weight: bold;
        }

        .login {
            text-align: center;

            margin-top: 22px;
            padding-top: 18px;

            border-top: 1px solid #e2e8f0;

            color: #64748b;
            font-size: 14px;
        }

        .login a {
            color: #0369a1;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            .container {
                padding: 25px 20px;
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <div class="logo">
            HG
        </div>

        <h2>
            Create Account
        </h2>

        <p class="subtitle">
            Join Hot Gist BUK
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerBtn"
            >
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        }
        from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


        // Firebase configuration

        const firebaseConfig = {

            apiKey: "AIzaSyB3OTW__dTaKmI7wa1Afc7vzUwgfWBtMkg",

            authDomain: "buk-hot-gist.firebaseapp.com",

            projectId: "buk-hot-gist",

            storageBucket: "buk-hot-gist.firebasestorage.app",

            messagingSenderId: "108695342341",

            appId: "1:108695342341:web:fa1f0cc806b870f05abb6c",

            measurementId: "G-NP5M9XDGKJ"

        };


        // Initialize Firebase

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // Get elements

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerBtn =
            document.getElementById("registerBtn");


        // Registration

        registerForm.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                const fullName =
                    document
                        .getElementById("fullName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                // Loading state

                message.style.color = "#0369a1";

                message.textContent =
                    "Creating your account...";

                registerBtn.disabled = true;

                registerBtn.textContent =
                    "Creating Account...";


                try {

                    // 1. Create Firebase Authentication account

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    // 2. Add user's name to Firebase Authentication

                    await updateProfile(
                        user,
                        {
                            displayName: fullName
                        }
                    );


                    // 3. Create Firestore user profile

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {
                            uid: user.uid,

                            name: fullName,

                            email: email,

                            role: "user",

                            createdAt:
                                serverTimestamp()
                        }
                    );


                    // Success message

                    message.style.color =
                        "#16a34a";

                    message.textContent =
                        "Account created successfully!";


                    // Send user to login

                    setTimeout(() => {

                        window.location.href =
                            "login.html";

                    }, 1500);


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    message.style.color =
                        "#dc2626";


                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        message.textContent =
                            "This email is already registered.";

                    }

                    else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        message.textContent =
                            "Password should be at least 6 characters.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        message.textContent =
                            "Please enter a valid email address.";

                    }

                    else {

                        message.textContent =
                            "Registration failed. Please try again.";

                    }


                    registerBtn.disabled = false;

                    registerBtn.textContent =
                        "Create Account";

                }

            }
        );

    </script>

</body>
</html>
